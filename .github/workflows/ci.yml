name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint und Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Workflow-Dateien pruefen
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: OpenAPI-Contract erzeugen
        run: pnpm run api:generate

      - name: OpenAPI-Contract pruefen
        run: pnpm run api:lint

      - name: Contract-Drift pruefen
        run: |
          if ! git diff --exit-code -- docs/api/; then
            echo "::error::Der eingecheckte OpenAPI-Contract weicht vom Code ab."
            echo "::error::Lokal 'pnpm --filter @infrademand/requirement api:generate' ausfuehren und das Ergebnis committen."
            exit 1
          fi

      - name: Inkompatible Contract-Aenderungen pruefen
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/oasdiff
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git show "FETCH_HEAD:docs/api/requirement.openapi.yaml" > /tmp/oasdiff/vorher.yaml 2>/dev/null; then
            echo "Kein Vorgaengerstand im Zielbranch - Pruefung entfaellt."
            exit 0
          fi
          docker run --rm \
            -v /tmp/oasdiff:/base:ro \
            -v "$PWD/docs/api:/rev:ro" \
            tufin/oasdiff:v1.27.0@sha256:279f71b494c578f8c7038ce4f9bf5e876f6a4661c4793537a773a00184c79454 breaking /base/vorher.yaml /rev/requirement.openapi.yaml --fail-on ERR

      - name: Inkompatible Contract-Aenderungen pruefen
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/oasdiff
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git show "FETCH_HEAD:docs/api/requirement.openapi.yaml" > /tmp/oasdiff/vorher.yaml 2>/dev/null; then
            echo "Kein Vorgaengerstand im Zielbranch - Pruefung entfaellt."
            exit 0
          fi
          docker run --rm \
            -v /tmp/oasdiff:/base:ro \
            -v "$PWD/docs/api:/rev:ro" \
            tufin/oasdiff:v1.27.0@sha256:279f71b494c578f8c7038ce4f9bf5e876f6a4661c4793537a773a00184c79454 breaking /base/vorher.yaml /rev/requirement.openapi.yaml --fail-on ERR

  realm:
    name: Keycloak-Realm validieren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Infrastruktur starten
        run: docker compose -f infra/local/compose.yaml up -d --wait

      - name: Realm anwenden
        run: docker compose -f infra/local/compose.yaml --profile config run --rm keycloak-config

      - name: Wiederholte Anwendung ist idempotent
        run: docker compose -f infra/local/compose.yaml --profile config run --rm keycloak-config

      - name: Lokale Werte laden
        run: |
          set -a
          # shellcheck disable=SC1091
          . infra/local/local.env
          set +a
          echo "KEYCLOAK_ISSUER_URL=$KEYCLOAK_ISSUER_URL" >> "$GITHUB_ENV"

      - name: Realm ist erreichbar
        run: |
          issuer=$(curl -sf "$KEYCLOAK_ISSUER_URL/.well-known/openid-configuration" | jq -r .issuer)
          test "$issuer" = "$KEYCLOAK_ISSUER_URL"

      - name: Anspruchskette im Token pruefen
        run: |
          token=$(curl -sf -X POST \
            -d client_id=frontend -d username=test.author -d password=test -d grant_type=password \
            "$KEYCLOAK_ISSUER_URL/protocol/openid-connect/token" | jq -r .access_token)

          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in 2) payload="$payload==" ;; 3) payload="$payload=" ;; esac
          claims=$(echo "$payload" | base64 -d)

          echo "$claims" | jq -e '(.aud | if type=="array" then . else [.] end) | index("requirement-api")' >/dev/null
          echo "$claims" | jq -e '.realm_access.roles | index("requirement-author")' >/dev/null
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Migrationen anwenden
        run: pnpm --filter @infrademand/requirement db:migrate

      - name: Integrationstests gegen Keycloak
        run: pnpm run test:integration

      - name: Logs bei Fehlschlag
        if: failure()
        run: docker compose -f infra/local/compose.yaml logs --no-color

      - name: Aufraeumen
        if: always()
        run: docker compose -f infra/local/compose.yaml down -v

  security:
    name: Sicherheitspruefung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Abhaengigkeiten und Geheimnisse pruefen
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --skip-dirs node_modules --exit-code 1 .

      - name: Konfiguration pruefen
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:latest@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            config --severity HIGH,CRITICAL --exit-code 1 .

      - name: Laufzeit-Images pruefen
        run: |
          images=$(docker compose -f infra/local/compose.yaml config --images | sort -u)
          status=0
          for image in $images; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" aquasec/trivy:latest@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
              image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /src/.trivyignore.yaml --exit-code 1 "$image" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Werkzeug-Images pruefen (nur Bericht)
        run: |
          runtime=$(docker compose -f infra/local/compose.yaml config --images | sort -u)
          alle=$(docker compose -f infra/local/compose.yaml --profile config config --images | sort -u)
          for image in $(comm -13 <(echo "$runtime") <(echo "$alle")); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" aquasec/trivy:latest@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
              image --severity HIGH,CRITICAL --ignore-unfixed "$image"
            echo "::endgroup::"
          done

  test:
    name: Typecheck und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
