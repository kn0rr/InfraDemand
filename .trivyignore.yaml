      # --- openpolicyagent/opa 1.19.0, Go-Standardbibliothek 1.26.5 -------------
  # RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. Behoben in Go 1.26.6. Es gibt kein
  # OPA-Abbild damit: Auch der Entwicklungsstand 1.20.0-dev vom 2026-08-13 ist
  # mit go1.26.5 gebaut. Heben ist nicht moeglich, auch nicht auf einen
  # Vorabstand - und ein Vorabstand waere fuer die Komponente, die Berechtigungen
  # entscheidet, ohnehin die schlechtere Wahl.
  #
  # Mindernd, aber ausdruecklich KEIN Unerreichbarkeitsnachweis: Der Sidecar laedt
  # seine Richtlinien aus Dateien - kein Bundle-Server, keine Uebertragung der
  # Entscheidungsprotokolle, kein http.send in einer Richtlinie. In dieser
  # Konfiguration entstehen keine ausgehenden HTTP- oder DNS-Aufrufe. Das ist
  # Konfiguration und kein Beweis, dieselbe Unterscheidung wie bei micrometer-core.
  - id: CVE-2026-39821
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. golang.org/x/net/idna in net/http. NEU BEWERTEN, sobald ein Bundle-Server, eine Protokolluebertragung oder http.send hinzukommt - siehe ADR-0028, Folgeentscheidung zur Richtlinienverteilung."
    expired_at: 2026-09-30
  - id: CVE-2026-46600
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. golang.org/x/net/dns/dnsmessage. NEU BEWERTEN wie beim vorigen Eintrag."
    expired_at: 2026-09-30
    # Nachtrag 2026-08-16: sechs weitere Lücken derselben Go-Fassung. Geprueft: Auch
  # `openpolicyagent/opa:edge` (1.20.0-dev) ist weiterhin mit go1.26.5 gebaut - es gibt
  # kein Abbild mit dem Fix. Die Erwaegungen des Blocks oben gelten unveraendert.
  #
  # Bewusst NICHT je Paket als unerreichbar gefuehrt: OPA *ist* ein HTTP-Server, und
  # net/http sowie net/url liegen damit im Bedienpfad. Dass unser Sidecar kein TLS spricht
  # und keine Vorlagen rendert, ist Konfiguration und kein Beweis.
  - id: CVE-2026-33818
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. encoding/asn1, DoS ueber Rekursion in Unmarshal."
    expired_at: 2026-09-30
  - id: CVE-2026-56853
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. net/http, DoS ueber unverschluesselte HTTP/2-Verbindungen. Im Bedienpfad des Sidecars."
    expired_at: 2026-09-30
  - id: CVE-2026-56858
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. html/template, XSS. OPA rendert in unserer Konfiguration keine Vorlagen - Konfiguration, kein Beweis."
    expired_at: 2026-09-30
  - id: CVE-2026-56859
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. encoding/xml, DoS ueber Rekursionstiefe."
    expired_at: 2026-09-30
  - id: CVE-2026-56860
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. net/url, quadratische Laufzeit bei der Pfadzerlegung. Im Bedienpfad des Sidecars."
    expired_at: 2026-09-30
  - id: CVE-2026-56862
    paths: ["opa"]
    statement: "RISIKO AKZEPTIERT, UPSTREAM AUSSTEHEND. crypto/tls, DoS ueber KeyUpdate. Der Sidecar spricht kein TLS - Konfiguration, kein Beweis."
    expired_at: 2026-09-30

