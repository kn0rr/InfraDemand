vulnerabilities:
  # --- postgres:18-alpine, Alpine-Paket -------------------------------------
  # Real behebbar, sobald das Basis-Image neu gebaut wird. Kurze Frist.
  - id: CVE-2026-33630
    statement: "c-ares in postgres:18-alpine; Fix 1.34.8-r0 liegt vor, Image noch nicht neu gebaut. Kurzfristig akzeptiert."
    expired_at: 2026-09-04

