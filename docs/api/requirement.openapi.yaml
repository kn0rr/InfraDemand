components:
  schemas:
    AbgewieseneLieferung:
      properties:
        count:
          description: Wie oft eine Uebernahme dieses Feldes bisher abgewiesen wurde.
          example: 47
          type: integer
        occurredAt:
          format: date-time
          type: string
        sourceSystem:
          example: sap
          type: string
        value:
          description: Der zuletzt abgewiesene Wert.
          type: object
      required:
        - value
        - sourceSystem
        - occurredAt
        - count
      type: object
    AttributeDefinitionResponse:
      properties:
        active:
          description: >-
            Ausser Kraft gesetzte Definitionen bleiben bestehen - bestehende Anforderungen tragen
            Werte, die nur mit ihnen deutbar sind.
          type: boolean
        allowedValues:
          description: Zulaessige Werte bei enum und multi_enum, sonst leer.
          items:
            type: string
          type:
            - array
            - 'null'
        createdAt:
          format: date-time
          type: string
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        id:
          format: uuid
          type: string
        key:
          example: kostenstelle
          type: string
        label:
          example: Kostenstelle
          type: string
        required:
          type: boolean
        requirementType:
          description: 'Anforderungstyp, fuer den die Definition gilt. Leer bedeutet: fuer alle.'
          type:
            - string
            - 'null'
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - key
        - requirementType
        - label
        - dataType
        - required
        - defaultValue
        - allowedValues
        - active
        - createdAt
        - updatedAt
        - version
      type: object
    AttributeDefinitionVersionResponse:
      properties:
        active:
          description: >-
            Ausser Kraft gesetzte Definitionen bleiben bestehen - bestehende Anforderungen tragen
            Werte, die nur mit ihnen deutbar sind.
          type: boolean
        allowedValues:
          description: Zulaessige Werte bei enum und multi_enum, sonst leer.
          items:
            type: string
          type:
            - array
            - 'null'
        changeSource:
          type: string
        changedBy:
          type: string
        createdAt:
          format: date-time
          type: string
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        id:
          format: uuid
          type: string
        key:
          example: kostenstelle
          type: string
        label:
          example: Kostenstelle
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        required:
          type: boolean
        requirementType:
          description: 'Anforderungstyp, fuer den die Definition gilt. Leer bedeutet: fuer alle.'
          type:
            - string
            - 'null'
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - key
        - requirementType
        - label
        - dataType
        - required
        - defaultValue
        - allowedValues
        - active
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    BedingungsverstossResponse:
      properties:
        kind:
          enum:
            - rolle
            - vier_augen
            - identitaet
            - pflichtfelder
            - feldwert
            - begruendung
          example: vier_augen
          type: string
        message:
          description: Fuer Menschen. Nicht zum Auswerten - der Wortlaut kann sich aendern.
          example: Dieser Uebergang verlangt eine andere Person als die, die "in_pruefung" ausgeloest hat
          type: string
      required:
        - kind
        - message
      type: object
    CreateAttributeDefinitionDto:
      properties:
        allowedValues:
          description: Pflicht bei enum und multi_enum, unzulaessig bei allen anderen Typen.
          items:
            type: string
          type: array
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        key:
          description: >-
            Schluessel im Feld dynamicAttributes. Kleinbuchstaben, Ziffern und Unterstrich - der
            Wert wird zum JSON-Schluessel und zum Formularfeldnamen.
          example: kostenstelle
          maxLength: 100
          type: string
        label:
          example: Kostenstelle
          maxLength: 200
          type: string
        required:
          default: false
          type: boolean
        requirementType:
          description: Ohne Angabe gilt die Definition fuer alle Anforderungstypen.
          example: bestellung
          maxLength: 100
          type: string
      required:
        - key
        - label
        - dataType
      type: object
    CreateMastershipRuleDto:
      properties:
        field:
          example: owner
          maxLength: 100
          type: string
        mode:
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          type: string
      required:
        - field
        - mode
      type: object
    CreateRequirementDto:
      properties:
        dynamicAttributes:
          additionalProperties: true
          type: object
        externalId:
          description: >-
            Bezeichner im Herkunftssystem. Zusammen mit sourceSystem eindeutig - eine Wiederholung
            wird mit 409 abgewiesen (Idempotenz nach §19.1).
          example: A-4711
          maxLength: 200
          type: string
        owner:
          maxLength: 200
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          maxLength: 100
          type: string
        sourceSystem:
          description: 'Herkunft der Daten (§19.1). Ohne Angabe: eigene Erfassung.'
          example: sap
          maxLength: 100
          type: string
        tenant:
          description: >-
            Mandant, dem die Anforderung gehoert (§15). Muss einer der eigenen sein - er bestimmt,
            wer sie spaeter sehen und aendern darf (ADR-0026).
          example: t-eins
          maxLength: 100
          type: string
      required:
        - projectId
        - requirementType
        - owner
        - tenant
      type: object
    CreateWorkflowDefinitionDto:
      properties:
        initialState:
          example: neu
          maxLength: 100
          type: string
        label:
          example: Standardablauf
          maxLength: 200
          type: string
        mode:
          default: internal
          enum:
            - internal
            - external
          type: string
        requirementType:
          description: Ohne Angabe gilt der Workflow fuer alle Typen ohne eigenen.
          example: bestellung
          maxLength: 100
          type: string
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
          type: array
      required:
        - label
        - initialState
        - states
        - transitions
      type: object
    FesthaltungUebersicht:
      properties:
        externalId:
          example: A-4711
          type:
            - string
            - 'null'
        field:
          example: owner
          type: string
        heldBy:
          type: string
        heldSince:
          format: date-time
          type: string
        heldValue:
          description: Der festgehaltene Wert.
          type: object
        lastRejection:
          allOf:
            - $ref: '#/components/schemas/AbgewieseneLieferung'
          description: Leer, solange kein automatischer Lauf dieses Feld aendern wollte.
          type:
            - object
            - 'null'
        reason:
          type: string
        requirementId:
          format: uuid
          type: string
        sourceSystem:
          example: sap
          type: string
      required:
        - requirementId
        - sourceSystem
        - externalId
        - field
        - heldValue
        - heldSince
        - heldBy
        - reason
        - lastRejection
      type: object
    HebeFassungDto:
      properties:
        reason:
          example: Freigaberolle in Fassung 2 war falsch gesetzt, mit Fassung 3 berichtigt
          maxLength: 500
          minLength: 10
          type: string
      required:
        - reason
      type: object
    MastershipRuleResponse:
      properties:
        bindings:
          additionalProperties:
            type: string
          description: >-
            Geltungsbereich nach ADR-0017 A6. Vorerst immer leer - eine Regel gilt fuer alle
            Anforderungen.
          type: object
        createdAt:
          format: date-time
          type: string
        field:
          description: Kernfeld oder Schluessel eines dynamischen Attributs.
          example: owner
          type: string
        id:
          format: uuid
          type: string
        mode:
          description: >-
            manual_allowed: jede berechtigte Quelle schreibt, die letzte gewinnt. automatic_wins:
            manuelle Aenderung wird abgewiesen, solange eine automatische Quelle das Feld bespielt.
            manual_locked: manuelle Aenderung ist immer verboten.
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          example: automatic_wins
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - field
        - mode
        - bindings
        - createdAt
        - updatedAt
        - version
      type: object
    MastershipRuleVersionResponse:
      properties:
        bindings:
          additionalProperties:
            type: string
          description: >-
            Geltungsbereich nach ADR-0017 A6. Vorerst immer leer - eine Regel gilt fuer alle
            Anforderungen.
          type: object
        changeSource:
          type: string
        changedBy:
          type: string
        createdAt:
          format: date-time
          type: string
        field:
          description: Kernfeld oder Schluessel eines dynamischen Attributs.
          example: owner
          type: string
        id:
          format: uuid
          type: string
        mode:
          description: >-
            manual_allowed: jede berechtigte Quelle schreibt, die letzte gewinnt. automatic_wins:
            manuelle Aenderung wird abgewiesen, solange eine automatische Quelle das Feld bespielt.
            manual_locked: manuelle Aenderung ist immer verboten.
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          example: automatic_wins
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - field
        - mode
        - bindings
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    OrdneZustandZuDto:
      properties:
        reason:
          example: Bestand aus der Altablage, Zustand 'Freigegeben' entspricht 'in_pruefung'
          maxLength: 500
          minLength: 10
          type: string
        state:
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - state
        - reason
      type: object
    PatchRequirementDto:
      properties:
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Wird schluesselweise mit dem Bestand zusammengefuehrt. Ein nicht genannter Schluessel
            bleibt unveraendert; `null` loescht ihn.
          type: object
        owner:
          maxLength: 200
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          maxLength: 100
          type: string
      type: object
    RequirementResponse:
      properties:
        createdAt:
          format: date-time
          type: string
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Dynamische Attribute nach §6. Das gueltige Schema je Anforderungstyp wird zur Laufzeit
            ausgeliefert und ist hier bewusst nicht abgebildet.
          type: object
        externalId:
          description: Bezeichner im Herkunftssystem. Leer bei eigener Erfassung.
          type:
            - string
            - 'null'
        heldFields:
          additionalProperties: true
          description: >-
            Felder, die gegen automatische Uebernahme festgehalten sind (§19.3). Schluessel ist der
            Feldname, Wert traegt `by`, `at` und `reason`.
          type: object
        id:
          format: uuid
          type: string
        owner:
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          type: string
        sourceSystem:
          description: 'Herkunftssystem des Datensatzes (§19.1). Eigene Erfassung: infrademand.'
          example: infrademand
          type: string
        status:
          description: >-
            Interner Status. Noch nicht das stabile Statusvokabular des Integrationsvertrags nach
            CLAUDE.md §19.1 - die Abbildung folgt mit der Workflow-Engine in M4.
          example: neu
          type: string
        tenant:
          description: >-
            Mandant, dem die Anforderung gehoert (§15). Er entscheidet, wer sie sehen und aendern
            darf (ADR-0026).
          example: t-eins
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
        workflow:
          allOf:
            - $ref: '#/components/schemas/RequirementWorkflowResponse'
          description: Workflow und Fassung, gegen die Zustandswechsel geprueft werden.
      required:
        - id
        - projectId
        - requirementType
        - tenant
        - workflow
        - status
        - owner
        - sourceSystem
        - externalId
        - dynamicAttributes
        - createdAt
        - updatedAt
        - version
        - heldFields
      type: object
    RequirementVersionResponse:
      properties:
        changeSource:
          description: Client, der die Aenderung ausgefuehrt hat - aus dem Token.
          type: string
        changedBy:
          description: Ausloesende Identitaet.
          type: string
        createdAt:
          format: date-time
          type: string
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Dynamische Attribute nach §6. Das gueltige Schema je Anforderungstyp wird zur Laufzeit
            ausgeliefert und ist hier bewusst nicht abgebildet.
          type: object
        externalId:
          description: Bezeichner im Herkunftssystem. Leer bei eigener Erfassung.
          type:
            - string
            - 'null'
        heldFields:
          additionalProperties: true
          description: >-
            Felder, die gegen automatische Uebernahme festgehalten sind (§19.3). Schluessel ist der
            Feldname, Wert traegt `by`, `at` und `reason`.
          type: object
        id:
          format: uuid
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        owner:
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          type: string
        sourceSystem:
          description: 'Herkunftssystem des Datensatzes (§19.1). Eigene Erfassung: infrademand.'
          example: infrademand
          type: string
        status:
          description: >-
            Interner Status. Noch nicht das stabile Statusvokabular des Integrationsvertrags nach
            CLAUDE.md §19.1 - die Abbildung folgt mit der Workflow-Engine in M4.
          example: neu
          type: string
        tenant:
          description: >-
            Mandant, dem die Anforderung gehoert (§15). Er entscheidet, wer sie sehen und aendern
            darf (ADR-0026).
          example: t-eins
          type: string
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          description: Leer bei der aktuell gueltigen Version.
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
        workflow:
          allOf:
            - $ref: '#/components/schemas/RequirementWorkflowResponse'
          description: Workflow und Fassung, gegen die Zustandswechsel geprueft werden.
      required:
        - id
        - projectId
        - requirementType
        - tenant
        - workflow
        - status
        - owner
        - sourceSystem
        - externalId
        - dynamicAttributes
        - createdAt
        - updatedAt
        - version
        - heldFields
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    RequirementWorkflowResponse:
      properties:
        id:
          format: uuid
          type: string
        version:
          description: >-
            Fassung, unter der diese Anforderung laeuft - nicht zwingend die aktuelle. Eine
            Aenderung der Definition wirkt nicht rueckwirkend (§7).
          example: 1
          type: integer
      required:
        - id
        - version
      type: object
    SetzeFesthaltungDto:
      properties:
        reason:
          example: Von SAP falsch gepflegt, Korrektur dort beantragt unter TICKET-4711
          maxLength: 500
          minLength: 10
          type: string
      required:
        - reason
      type: object
    UebergangsauskunftResponse:
      properties:
        currentState:
          example: in_pruefung
          type: string
        currentStateInWorkflow:
          description: >-
            Ob der aktuelle Zustand im geltenden Graphen vorkommt. Bei `false` ist kein Uebergang
            moeglich, bis ein Administrator ihn zuordnet (ADR-0022 Punkt 5) - die Anforderung ist
            dann nicht fertig, sondern haengt.
          type: boolean
        states:
          description: >-
            Alle Zustaende der gebundenen Fassung - die Auswahl fuer die Zuordnung, wenn der
            aktuelle Zustand nicht darin vorkommt (ADR-0022 Punkt 5). Immer gefuellt, gerade auch
            dann, wenn `transitions` leer ist.
          items:
            $ref: '#/components/schemas/WorkflowZustandResponse'
          type: array
        transitions:
          description: >-
            Alle Uebergaenge aus dem aktuellen Zustand, zulaessige wie gesperrte. Bei
            fremdgefuehrten Workflows leer: Dort entscheidet das Fremdsystem (ADR-0021).
          items:
            $ref: '#/components/schemas/UebergangsoptionResponse'
          type: array
      required:
        - currentState
        - currentStateInWorkflow
        - states
        - transitions
      type: object
    UebergangsoptionResponse:
      properties:
        allowed:
          description: Ob dieser Uebergang jetzt und von diesem Anwender genommen werden kann.
          type: boolean
        blockedBy:
          description: Leer, wenn zulaessig. Sonst jeder Grund einzeln, damit die Oberflaeche alle nennen kann.
          items:
            $ref: '#/components/schemas/BedingungsverstossResponse'
          type: array
        label:
          example: Einreichen
          type: string
        requiresReason:
          description: >-
            Der Uebergang verlangt eine Begruendung. **Kein Hinderungsgrund** - sie wird beim
            Ausloesen mitgegeben, nicht vorher erfuellt. Deshalb zaehlt sie nicht in `blockedBy`.
          type: boolean
        toState:
          example: in_pruefung
          type: string
      required:
        - toState
        - label
        - allowed
        - blockedBy
        - requiresReason
      type: object
    UpdateAttributeDefinitionDto:
      properties:
        active:
          description: false setzt die Definition ausser Kraft, ohne sie zu loeschen.
          type: boolean
        allowedValues:
          items:
            type: string
          type: array
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        label:
          maxLength: 200
          type: string
        required:
          type: boolean
      required:
        - label
        - dataType
        - required
        - active
      type: object
    UpdateMastershipRuleDto:
      properties:
        mode:
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          type: string
      required:
        - mode
      type: object
    UpdateWorkflowDefinitionDto:
      properties:
        active:
          description: false setzt den Workflow ausser Kraft, ohne ihn zu loeschen.
          type: boolean
        initialState:
          maxLength: 100
          type: string
        label:
          maxLength: 200
          type: string
        mode:
          enum:
            - internal
            - external
          type: string
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
          type: array
      required:
        - label
        - mode
        - initialState
        - states
        - transitions
        - active
      type: object
    VergleichDto:
      properties:
        feld:
          example: kostenschaetzung
          maxLength: 100
          type: string
        operator:
          enum:
            - istGleich
            - istUngleich
            - mindestens
            - hoechstens
            - istEinesVon
            - istGefuellt
          example: mindestens
          type: string
        wert:
          description: istEinesVon erwartet eine Liste, istGefuellt einen Wahrheitswert.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items: {}
              type: array
            - type: 'null'
      required:
        - feld
        - operator
        - wert
      type: object
    WechsleZustandDto:
      properties:
        reason:
          description: >-
            Pflicht, wenn der Uebergang eine Begruendung verlangt (ADR-0024). Sie wird als
            Bestandteil der Version festgehalten, nicht als Kommentar daneben.
          example: Budget durch die Bereichsleitung bestaetigt
          maxLength: 500
          type: string
        toState:
          description: Schluessel des Zielzustands aus dem geltenden Workflow.
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - toState
      type: object
    WorkflowBedingungDto:
      properties:
        andersAlsBeiEintritt:
          description: 'Bei art=vier_augen: Schluessel des Zustands.'
          type: string
        art:
          enum:
            - rolle
            - vier_augen
            - identitaet
            - pflichtfelder
            - feldwert
            - begruendung
          type: string
        eineVon:
          description: 'Bei art=rolle: eine davon genuegt.'
          items:
            type: string
          type: array
        feld:
          description: Bei art=identitaet und art=feldwert.
          type: string
        felder:
          description: Bei art=pflichtfelder.
          items:
            type: string
          type: array
        mindestlaenge:
          description: Bei art=begruendung.
          minimum: 1
          type: integer
        nurWenn:
          description: Vorbehalt - alle Vergleiche muessen gelten, damit die Bedingung greift.
          items:
            $ref: '#/components/schemas/VergleichDto'
          type: array
        operator:
          description: Bei art=feldwert.
          enum:
            - istGleich
            - istUngleich
            - mindestens
            - hoechstens
            - istEinesVon
            - istGefuellt
          type: string
        wert:
          description: Bei art=feldwert der Vergleichswert.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items: {}
              type: array
            - type: 'null'
      required:
        - art
      type: object
    WorkflowDefinitionResponse:
      properties:
        active:
          description: false setzt den Workflow ausser Kraft, ohne ihn zu loeschen.
          type: boolean
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        initialState:
          example: neu
          type: string
        label:
          example: Standardablauf
          type: string
        mode:
          description: >-
            internal: Uebergaenge werden hier geprueft und abgewiesen. external: Ein Fremdsystem
            fuehrt den Vorgang, der Graph beschreibt ihn nur (ADR-0021).
          enum:
            - internal
            - external
          type: string
        requirementType:
          description: 'Anforderungstyp, fuer den der Workflow gilt. Leer bedeutet: fuer alle uebrigen.'
          type:
            - string
            - 'null'
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateResponse'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionResponse'
          type: array
        unreachableStates:
          description: >-
            Zustaende, die vom Anfangszustand aus nicht erreichbar sind. Kein Fehler - ein Graph im
            Aufbau ist unvollstaendig, nicht falsch -, aber ein Hinweis fuer die
            Verwaltungsoberflaeche.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - label
        - requirementType
        - mode
        - initialState
        - states
        - transitions
        - unreachableStates
        - active
        - createdAt
        - updatedAt
        - version
      type: object
    WorkflowDefinitionVersionResponse:
      properties:
        active:
          description: false setzt den Workflow ausser Kraft, ohne ihn zu loeschen.
          type: boolean
        changeSource:
          type: string
        changedBy:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        initialState:
          example: neu
          type: string
        label:
          example: Standardablauf
          type: string
        mode:
          description: >-
            internal: Uebergaenge werden hier geprueft und abgewiesen. external: Ein Fremdsystem
            fuehrt den Vorgang, der Graph beschreibt ihn nur (ADR-0021).
          enum:
            - internal
            - external
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        requirementType:
          description: 'Anforderungstyp, fuer den der Workflow gilt. Leer bedeutet: fuer alle uebrigen.'
          type:
            - string
            - 'null'
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateResponse'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionResponse'
          type: array
        unreachableStates:
          description: >-
            Zustaende, die vom Anfangszustand aus nicht erreichbar sind. Kein Fehler - ein Graph im
            Aufbau ist unvollstaendig, nicht falsch -, aber ein Hinweis fuer die
            Verwaltungsoberflaeche.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - label
        - requirementType
        - mode
        - initialState
        - states
        - transitions
        - unreachableStates
        - active
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    WorkflowStateDto:
      properties:
        final:
          default: false
          description: Endzustand - von hier fuehrt kein Uebergang weiter.
          type: boolean
        key:
          example: in_pruefung
          maxLength: 100
          type: string
        label:
          example: In Pruefung
          maxLength: 200
          type: string
      required:
        - key
        - label
      type: object
    WorkflowStateResponse:
      properties:
        final:
          type: boolean
        key:
          example: in_pruefung
          type: string
        label:
          example: In Pruefung
          type: string
      required:
        - key
        - label
        - final
      type: object
    WorkflowTransitionDto:
      properties:
        bedingungen:
          description: Alle muessen erfuellt sein. Ohne Angabe gibt es keine (ADR-0024).
          items:
            $ref: '#/components/schemas/WorkflowBedingungDto'
          type: array
        from:
          example: neu
          maxLength: 100
          type: string
        label:
          example: Einreichen
          maxLength: 200
          type: string
        to:
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - from
        - to
        - label
      type: object
    WorkflowTransitionResponse:
      properties:
        bedingungen:
          description: >-
            Bedingungen an diesem Uebergang (ADR-0024). Leer, wenn es keine gibt. Nur fuer
            platform-admin lesbar - sie beschreiben, wer was freigeben darf.
          items:
            $ref: '#/components/schemas/WorkflowBedingungDto'
          type: array
        from:
          type: string
        label:
          type: string
        to:
          type: string
      required:
        - from
        - to
        - label
        - bedingungen
      type: object
    WorkflowVersionUsageResponse:
      properties:
        current:
          description: >-
            Ob dies die aktuelle Fassung ist. Alles andere laeuft auf einer aelteren - gewollt nach
            §7, aber der Ort, an dem ein Heben zu erwaegen ist (ADR-0025).
          type: boolean
        requirements:
          description: Anforderungen auf dieser Fassung.
          example: 17
          type: integer
        version:
          example: 2
          type: integer
      required:
        - version
        - requirements
        - current
      type: object
    WorkflowZustandResponse:
      properties:
        key:
          example: in_pruefung
          type: string
        label:
          example: In Pruefung
          type: string
      required:
        - key
        - label
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: >-
    Anforderungen, Projekte und Lebenszyklus. Versionierter Contract nach CLAUDE.md §12 -
    Aenderungen unterliegen der Kompatibilitaetspruefung.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Requirement Service
  version: '1'
openapi: 3.1.0
paths:
  /health:
    get:
      description: Unversioniert und ohne Token erreichbar - Ziel der Orchestrierungsschicht.
      operationId: HealthController_getHealth
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                type: object
          description: Dienst ist bereit
      security: []
      summary: Bereitschaftspruefung
      tags:
        - Betrieb
  /v1/attribute-definitions:
    get:
      description: >-
        Ohne requirementType alle Definitionen einschliesslich ausser Kraft gesetzter. Mit
        requirementType die fuer diesen Typ geltenden aktiven - typbezogene und allgemeine zusammen.
        Lesen ist nicht auf platform-admin beschraenkt: Das Frontend braucht die Definitionen, um
        Formulare aufzubauen (§6).
      operationId: AttributeDefinitionsController_findAll_v1
      parameters:
        - in: query
          name: requirementType
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AttributeDefinitionResponse'
                type: array
          description: ''
        '401':
          description: Kein oder ungueltiges Token
      security:
        - bearer: []
      summary: Attributdefinitionen auflisten
      tags:
        - Attributdefinitionen
    post:
      description: Aendert das gueltige Datenmodell und verlangt daher platform-admin.
      operationId: AttributeDefinitionsController_create_v1
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttributeDefinitionDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionResponse'
          description: ''
        '400':
          description: Rumpf unvollstaendig oder Werteliste unpassend
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '409':
          description: Schluessel fuer diesen Anforderungstyp bereits vergeben
      security:
        - bearer: []
      summary: Attributdefinition anlegen
      tags:
        - Attributdefinitionen
  /v1/attribute-definitions/{id}:
    put:
      description: >-
        Erzeugt eine neue Version (ADR-0012). key und requirementType sind unveraenderlich - sie
        bezeichnen die Definition.
      operationId: AttributeDefinitionsController_update_v1
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeDefinitionDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionResponse'
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '404':
          description: Definition existiert nicht
      security:
        - bearer: []
      summary: Attributdefinition aendern
      tags:
        - Attributdefinitionen
  /v1/attribute-definitions/{id}/versions:
    get:
      description: Vollstaendige Historie nach §19.4.
      operationId: AttributeDefinitionsController_findVersions_v1
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AttributeDefinitionVersionResponse'
                type: array
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '404':
          description: Definition existiert nicht
      security:
        - bearer: []
      summary: Versionen einer Attributdefinition
      tags:
        - Attributdefinitionen
  /v1/mastership-rules:
    get:
      description: >-
        Welche Quellenklasse fuer ein Feld den Vorrang hat (§19.3). Lesen ist nicht auf
        platform-admin beschraenkt - die Oberflaeche zeigt anhand der Regel, welche Felder von Hand
        pflegbar sind.
      operationId: MastershipController_findAll_v1
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MastershipRuleResponse'
                type: array
          description: ''
        '401':
          description: Kein oder ungueltiges Token
      security:
        - bearer: []
      summary: Hoheitsregeln auflisten
      tags:
        - Datenhoheit
    post:
      description: Entscheidet, wessen Schreibvorgang gewinnt, und verlangt platform-admin.
      operationId: MastershipController_create_v1
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMastershipRuleDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MastershipRuleResponse'
          description: ''
        '400':
          description: Feld ist weder Kernfeld noch definiertes Attribut
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '409':
          description: Fuer dieses Feld besteht bereits eine Regel
      security:
        - bearer: []
      summary: Hoheitsregel anlegen
      tags:
        - Datenhoheit
  /v1/mastership-rules/{id}:
    put:
      description: Erzeugt eine neue Version (ADR-0012). `field` ist unveraenderlich.
      operationId: MastershipController_update_v1
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMastershipRuleDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MastershipRuleResponse'
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '404':
          description: Regel existiert nicht
      security:
        - bearer: []
      summary: Hoheitsregel aendern
      tags:
        - Datenhoheit
  /v1/mastership-rules/{id}/versions:
    get:
      operationId: MastershipController_findVersions_v1
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MastershipRuleVersionResponse'
                type: array
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '404':
          description: Regel existiert nicht
      security:
        - bearer: []
      summary: Versionen einer Hoheitsregel
      tags:
        - Datenhoheit
  /v1/requirements:
    get:
      description: >-
        Ohne asOf der aktuelle Bestand, mit asOf der Zustand zum Stichtag (§19.4). Liefert
        ausschliesslich Anforderungen der eigenen Mandanten (§15, ADR-0026).
      operationId: RequirementsController_findAll_v1
      parameters:
        - description: >-
            Stichtag. Ohne Angabe der aktuelle Bestand, mit Angabe der Zustand, den das System zu
            diesem Zeitpunkt kannte (§19.4).
          in: query
          name: asOf
          required: false
          schema:
            format: date-time
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RequirementResponse'
                type: array
          description: Bestand
        '400':
          description: Unlesbarer Stichtag
        '401':
          description: Kein oder ungueltiges Token
      security:
        - bearer: []
      summary: Anforderungen auflisten
      tags:
        - Anforderungen
    post:
      operationId: RequirementsController_create_v1
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequirementDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: Angelegte Anforderung
        '400':
          description: >-
            Rumpf unvollstaendig, unbekannte Felder, sourceSystem nicht in der Registratur (ADR-0017
            A4), oder dynamische Attribute genuegen den geltenden Definitionen nicht (§6). Im
            letzten Fall traegt die Antwort zusaetzlich ein Feld `attributes` mit je einem Eintrag
            aus `key` und `message` fuer jedes beanstandete Attribut.
        '401':
          description: Kein oder ungueltiges Token
        '409':
          description: >-
            Zwei Ursachen. Entweder sind sourceSystem und externalId bereits vergeben (Idempotenz
            nach §19.1), oder fuer mindestens ein Feld ist eine andere Quelle massgeblich (§19.3).
            Im zweiten Fall traegt die Antwort ein Feld `fields` mit je einem Eintrag aus `field`,
            `reason` und `message`; im ersten fehlt es. Gespeichert wird in beiden Faellen nichts.
      security:
        - bearer: []
      summary: Anforderung anlegen
      tags:
        - Anforderungen
  /v1/requirements/by-source/{sourceSystem}/{externalId}:
    patch:
      description: >-
        Adressiert ueber Herkunftssystem und dortigen Bezeichner - interne Kennungen werden ueber
        die Servicegrenze nicht gereicht (ADR-0010). Teilweise Aenderung: ein nicht genanntes Feld
        bleibt unveraendert. Legt nicht an; dafuer POST.
      operationId: RequirementsController_patchBySource_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRequirementDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: Geaenderte Anforderung
        '400':
          description: Rumpf unzulaessig oder dynamische Attribute ungueltig
        '401':
          description: Kein oder ungueltiges Token
        '404':
          description: Kein Datensatz unter dieser Herkunft
        '409':
          description: >-
            Fuer mindestens ein Feld ist eine andere Quelle massgeblich (§19.3). Die Antwort traegt
            ein Feld `fields` mit je einem Eintrag aus `field`, `reason` und `message`. Es wird
            nichts gespeichert - auch nicht die zulaessigen Felder (ADR-0019 Punkt 1).
      security:
        - bearer: []
      summary: Anforderung ueber den fremden Bezeichner aendern
      tags:
        - Anforderungen
  /v1/requirements/by-source/{sourceSystem}/{externalId}/holds/{field}:
    delete:
      description: Eigener, ausdruecklicher Vorgang - keine Nebenwirkung einer Aenderung.
      operationId: RequirementsController_hebeFesthaltungAuf_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
        - in: path
          name: field
          required: true
          schema:
            example: owner
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '404':
          description: Datensatz oder Festhaltung existiert nicht
      security:
        - bearer: []
      summary: Festhaltung aufheben
      tags:
        - Anforderungen
    put:
      description: >-
        Ab dann aendert kein automatischer Ladevorgang dieses Feld an diesem Datensatz (§19.3). Die
        uebrigen Felder bleiben unberuehrt, und ein Import scheitert nicht - er uebernimmt sie und
        die Abweisung wird verzeichnet.
      operationId: RequirementsController_setzeFesthaltung_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
        - in: path
          name: field
          required: true
          schema:
            example: owner
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetzeFesthaltungDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: ''
        '400':
          description: Feld ist weder Kernfeld noch definiertes Attribut
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '404':
          description: Kein Datensatz unter dieser Herkunft
      security:
        - bearer: []
      summary: Feld gegen automatische Uebernahme festhalten
      tags:
        - Anforderungen
  /v1/requirements/by-source/{sourceSystem}/{externalId}/state:
    put:
      description: >-
        Eigener Vorgang statt eines Feldes im Rumpf (§7, ADR-0022). Genannt wird der Zielzustand;
        den passenden Uebergang ermittelt der Dienst. Bei fremdgefuehrten Workflows wird der Zustand
        entgegengenommen, ohne einen Uebergang zu verlangen - dort fuehrt das Fremdsystem
        (ADR-0021). Derselbe Zustand erneut zu senden aendert nichts und erzeugt keine Version
        (§19.1).
      operationId: RequirementsController_wechsleZustand_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechsleZustandDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: ''
        '400':
          description: Der Zielzustand kommt im geltenden Workflow nicht vor
        '401':
          description: Kein oder ungueltiges Token
        '404':
          description: Kein Datensatz unter dieser Herkunft
        '409':
          description: >-
            Vier Ursachen. Es gibt keinen Uebergang vom aktuellen in den gewuenschten Zustand; der
            aktuelle Zustand kommt im geltenden Workflow gar nicht vor und muss zuerst zugeordnet
            werden; die Bedingungen des Uebergangs sind nicht erfuellt, dann traegt die Antwort ein
            Feld `conditions`; oder fuer `status` ist eine andere Quelle massgeblich (§19.3), dann
            traegt sie ein Feld `fields`.
      security:
        - bearer: []
      summary: Zustand wechseln
      tags:
        - Anforderungen
  /v1/requirements/by-source/{sourceSystem}/{externalId}/state/assignment:
    put:
      description: >-
        Fuer Anforderungen, deren aktueller Zustand im geltenden Workflow nicht vorkommt - weil sie
        aelter sind als er, weil ein Import einen fremden Status geliefert hat oder weil ein Zustand
        entfernt wurde (ADR-0022 Punkt 5). **Kein Uebergang**: Es wird nicht geprueft, ob einer
        hinfuehrt, und die Historie weist den Vorgang als Zuordnung aus. Die Begruendung ist
        Pflicht.
      operationId: RequirementsController_ordneZustandZu_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdneZustandZuDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
          description: ''
        '400':
          description: Der Zustand kommt im geltenden Workflow nicht vor
        '401':
          description: Kein oder ungueltiges Token
        '403':
          description: Rolle platform-admin fehlt
        '404':
          description: Kein Datensatz unter dieser Herkunft
      security:
        - bearer: []
      summary: Zustand zuordnen
      tags:
        - Anforderungen
  /v1/requirements/by-source/{sourceSystem}/{externalId}/transitions:
    get:
      description: >-
        Grundlage fuer Schaltflaechen statt eines freien Statusfeldes (§7). Liefert alle Uebergaenge
        aus dem aktuellen Zustand - **auch die gesperrten, mit Begruendung**, damit die Oberflaeche
        sagen kann, warum etwas nicht geht. **Die Antwort haengt vom Anmeldenden ab** und darf nicht
        zwischengespeichert werden.
      operationId: RequirementsController_zulaessigeUebergaenge_v1
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            example: sap
            type: string
        - in: path
          name: externalId
          required: true
          schema:
            example: A-4711
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UebergangsauskunftResponse'
          description: ''
        '401':
          description: Kein oder ungueltiges Token
        '404':
          description: Kein Datensatz unter dieser Herkunft
      security:
        - bearer: []
