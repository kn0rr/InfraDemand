            - update
            - delete
          type: string
        requirementType:
          description: 'Anforderungstyp, fuer den der Workflow gilt. Leer bedeutet: fuer alle uebrigen.'
          type:
            - string
            - 'null'
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateResponse'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionResponse'
          type: array
        unreachableStates:
          description: >-
            Zustaende, die vom Anfangszustand aus nicht erreichbar sind. Kein Fehler - ein Graph im
            Aufbau ist unvollstaendig, nicht falsch -, aber ein Hinweis fuer die
            Verwaltungsoberflaeche.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - label
        - requirementType
        - mode
        - initialState
        - states
        - transitions
        - unreachableStates
        - active
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    WorkflowStateDto:
      properties:
        final:
          default: false
          description: Endzustand - von hier fuehrt kein Uebergang weiter.
          type: boolean
        key:
          example: in_pruefung
          maxLength: 100
          type: string
        label:
          example: In Pruefung
          maxLength: 200
          type: string
      required:
        - key
        - label
      type: object
    WorkflowStateResponse:
      properties:
        final:
          type: boolean
        key:
          example: in_pruefung
          type: string
        label:
          example: In Pruefung
          type: string
      required:
        - key
        - label
        - final
      type: object
    WorkflowTransitionDto:
      properties:
        from:
          example: neu
          maxLength: 100
          type: string
        label:
          example: Einreichen
          maxLength: 200
          type: string
        to:
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - from
        - to
        - label
      type: object
    WorkflowTransitionResponse:
      properties:
        from:
          type: string
        label:
          type: string
        to:
          type: string
      required:
        - from
        - to
        - label
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: >-
    Anforderungen, Projekte und Lebenszyklus. Versionierter Contract nach CLAUDE.md §12 -
    Aenderungen unterliegen der Kompatibilitaetspruefung.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Requirement Service
  version: '1'
openapi: 3.1.0
paths:
  /health:
    get:
      description: Unversioniert und ohne Token erreichbar - Ziel der Orchestrierungsschicht.
      operationId: HealthController_getHealth
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                type: object
          description: Dienst ist bereit
      security: []
      summary: Bereitschaftspruefung
      tags:
        - Betrieb
  /v1/attribute-definitions:
    get:
      description: >-
        Ohne requirementType alle Definitionen einschliesslich ausser Kraft gesetzter. Mit
        requirementType die fuer diesen Typ geltenden aktiven - typbezogene und allgemeine zusammen.
        Lesen ist nicht auf platform-admin beschraenkt: Das Frontend braucht die Definitionen, um
        Formulare aufzubauen (§6).
      operationId: AttributeDefinitionsController_findAll_v1
      parameters:
        - in: query
          name: requirementType
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AttributeDefinitionResponse'
                type: array
          description: ''
