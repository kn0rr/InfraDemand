components:
  schemas:
    AbgewieseneLieferung:
      properties:
        count:
          description: Wie oft eine Uebernahme dieses Feldes bisher abgewiesen wurde.
          example: 47
          type: integer
        occurredAt:
          format: date-time
          type: string
        sourceSystem:
          example: sap
          type: string
        value:
          description: Der zuletzt abgewiesene Wert.
          type: object
      required:
        - value
        - sourceSystem
        - occurredAt
        - count
      type: object
    AttributeDefinitionResponse:
      properties:
        active:
          description: >-
            Ausser Kraft gesetzte Definitionen bleiben bestehen - bestehende Anforderungen tragen
            Werte, die nur mit ihnen deutbar sind.
          type: boolean
        allowedValues:
          description: Zulaessige Werte bei enum und multi_enum, sonst leer.
          items:
            type: string
          type:
            - array
            - 'null'
        createdAt:
          format: date-time
          type: string
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        id:
          format: uuid
          type: string
        key:
          example: kostenstelle
          type: string
        label:
          example: Kostenstelle
          type: string
        required:
          type: boolean
        requirementType:
          description: 'Anforderungstyp, fuer den die Definition gilt. Leer bedeutet: fuer alle.'
          type:
            - string
            - 'null'
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - key
        - requirementType
        - label
        - dataType
        - required
        - defaultValue
        - allowedValues
        - active
        - createdAt
        - updatedAt
        - version
      type: object
    AttributeDefinitionVersionResponse:
      properties:
        active:
          description: >-
            Ausser Kraft gesetzte Definitionen bleiben bestehen - bestehende Anforderungen tragen
            Werte, die nur mit ihnen deutbar sind.
          type: boolean
        allowedValues:
          description: Zulaessige Werte bei enum und multi_enum, sonst leer.
          items:
            type: string
          type:
            - array
            - 'null'
        changeSource:
          type: string
        changedBy:
          type: string
        createdAt:
          format: date-time
          type: string
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        id:
          format: uuid
          type: string
        key:
          example: kostenstelle
          type: string
        label:
          example: Kostenstelle
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        required:
          type: boolean
        requirementType:
          description: 'Anforderungstyp, fuer den die Definition gilt. Leer bedeutet: fuer alle.'
          type:
            - string
            - 'null'
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - key
        - requirementType
        - label
        - dataType
        - required
        - defaultValue
        - allowedValues
        - active
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    CreateAttributeDefinitionDto:
      properties:
        allowedValues:
          description: Pflicht bei enum und multi_enum, unzulaessig bei allen anderen Typen.
          items:
            type: string
          type: array
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          example: text
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        key:
          description: >-
            Schluessel im Feld dynamicAttributes. Kleinbuchstaben, Ziffern und Unterstrich - der
            Wert wird zum JSON-Schluessel und zum Formularfeldnamen.
          example: kostenstelle
          maxLength: 100
          type: string
        label:
          example: Kostenstelle
          maxLength: 200
          type: string
        required:
          default: false
          type: boolean
        requirementType:
          description: Ohne Angabe gilt die Definition fuer alle Anforderungstypen.
          example: bestellung
          maxLength: 100
          type: string
      required:
        - key
        - label
        - dataType
      type: object
    CreateMastershipRuleDto:
      properties:
        field:
          example: owner
          maxLength: 100
          type: string
        mode:
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          type: string
      required:
        - field
        - mode
      type: object
    CreateRequirementDto:
      properties:
        dynamicAttributes:
          additionalProperties: true
          type: object
        externalId:
          description: >-
            Bezeichner im Herkunftssystem. Zusammen mit sourceSystem eindeutig - eine Wiederholung
            wird mit 409 abgewiesen (Idempotenz nach §19.1).
          example: A-4711
          maxLength: 200
          type: string
        owner:
          description: >-
            Kein Vorgabewert: Ein fest verdrahteter Anfangszustand waere eine Workflow-Annahme, und
            §7 macht Zustaende konfigurierbar. Ab M4 liefert ihn die Workflow-Definition.
          example: neu
          maxLength: 100
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          maxLength: 100
          type: string
        sourceSystem:
          description: 'Herkunft der Daten (§19.1). Ohne Angabe: eigene Erfassung.'
          example: sap
          maxLength: 100
          type: string
      required:
        - projectId
        - requirementType
        - owner
      type: object
    CreateWorkflowDefinitionDto:
      properties:
        initialState:
          example: neu
          maxLength: 100
          type: string
        label:
          example: Standardablauf
          maxLength: 200
          type: string
        mode:
          default: internal
          enum:
            - internal
            - external
          type: string
        requirementType:
          description: Ohne Angabe gilt der Workflow fuer alle Typen ohne eigenen.
          example: bestellung
          maxLength: 100
          type: string
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
          type: array
      required:
        - label
        - initialState
        - states
        - transitions
      type: object
    FesthaltungUebersicht:
      properties:
        externalId:
          example: A-4711
          type:
            - string
            - 'null'
        field:
          example: owner
          type: string
        heldBy:
          type: string
        heldSince:
          format: date-time
          type: string
        heldValue:
          description: Der festgehaltene Wert.
          type: object
        lastRejection:
          allOf:
            - $ref: '#/components/schemas/AbgewieseneLieferung'
          description: Leer, solange kein automatischer Lauf dieses Feld aendern wollte.
          type:
            - object
            - 'null'
        reason:
          type: string
        requirementId:
          format: uuid
          type: string
        sourceSystem:
          example: sap
          type: string
      required:
        - requirementId
        - sourceSystem
        - externalId
        - field
        - heldValue
        - heldSince
        - heldBy
        - reason
        - lastRejection
      type: object
    MastershipRuleResponse:
      properties:
        bindings:
          additionalProperties:
            type: string
          description: >-
            Geltungsbereich nach ADR-0017 A6. Vorerst immer leer - eine Regel gilt fuer alle
            Anforderungen.
          type: object
        createdAt:
          format: date-time
          type: string
        field:
          description: Kernfeld oder Schluessel eines dynamischen Attributs.
          example: owner
          type: string
        id:
          format: uuid
          type: string
        mode:
          description: >-
            manual_allowed: jede berechtigte Quelle schreibt, die letzte gewinnt. automatic_wins:
            manuelle Aenderung wird abgewiesen, solange eine automatische Quelle das Feld bespielt.
            manual_locked: manuelle Aenderung ist immer verboten.
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          example: automatic_wins
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - field
        - mode
        - bindings
        - createdAt
        - updatedAt
        - version
      type: object
    MastershipRuleVersionResponse:
      properties:
        bindings:
          additionalProperties:
            type: string
          description: >-
            Geltungsbereich nach ADR-0017 A6. Vorerst immer leer - eine Regel gilt fuer alle
            Anforderungen.
          type: object
        changeSource:
          type: string
        changedBy:
          type: string
        createdAt:
          format: date-time
          type: string
        field:
          description: Kernfeld oder Schluessel eines dynamischen Attributs.
          example: owner
          type: string
        id:
          format: uuid
          type: string
        mode:
          description: >-
            manual_allowed: jede berechtigte Quelle schreibt, die letzte gewinnt. automatic_wins:
            manuelle Aenderung wird abgewiesen, solange eine automatische Quelle das Feld bespielt.
            manual_locked: manuelle Aenderung ist immer verboten.
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          example: automatic_wins
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - field
        - mode
        - bindings
        - createdAt
        - updatedAt
        - version
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    OrdneZustandZuDto:
      properties:
        reason:
          example: Bestand aus der Altablage, Zustand 'Freigegeben' entspricht 'in_pruefung'
          maxLength: 500
          minLength: 10
          type: string
        state:
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - state
        - reason
      type: object
    PatchRequirementDto:
      properties:
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Wird schluesselweise mit dem Bestand zusammengefuehrt. Ein nicht genannter Schluessel
            bleibt unveraendert; `null` loescht ihn.
          type: object
        owner:
          maxLength: 200
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          maxLength: 100
          type: string
      type: object
    RequirementResponse:
      properties:
        createdAt:
          format: date-time
          type: string
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Dynamische Attribute nach §6. Das gueltige Schema je Anforderungstyp wird zur Laufzeit
            ausgeliefert und ist hier bewusst nicht abgebildet.
          type: object
        externalId:
          description: Bezeichner im Herkunftssystem. Leer bei eigener Erfassung.
          type:
            - string
            - 'null'
        heldFields:
          additionalProperties: true
          description: >-
            Felder, die gegen automatische Uebernahme festgehalten sind (§19.3). Schluessel ist der
            Feldname, Wert traegt `by`, `at` und `reason`.
          type: object
        id:
          format: uuid
          type: string
        owner:
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          type: string
        sourceSystem:
          description: 'Herkunftssystem des Datensatzes (§19.1). Eigene Erfassung: infrademand.'
          example: infrademand
          type: string
        status:
          description: >-
            Interner Status. Noch nicht das stabile Statusvokabular des Integrationsvertrags nach
            CLAUDE.md §19.1 - die Abbildung folgt mit der Workflow-Engine in M4.
          example: neu
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - projectId
        - requirementType
        - status
        - owner
        - sourceSystem
        - externalId
        - dynamicAttributes
        - createdAt
        - updatedAt
        - version
        - heldFields
      type: object
    RequirementVersionResponse:
      properties:
        changeSource:
          description: Client, der die Aenderung ausgefuehrt hat - aus dem Token.
          type: string
        changedBy:
          description: Ausloesende Identitaet.
          type: string
        createdAt:
          format: date-time
          type: string
        dynamicAttributes:
          additionalProperties: true
          description: >-
            Dynamische Attribute nach §6. Das gueltige Schema je Anforderungstyp wird zur Laufzeit
            ausgeliefert und ist hier bewusst nicht abgebildet.
          type: object
        externalId:
          description: Bezeichner im Herkunftssystem. Leer bei eigener Erfassung.
          type:
            - string
            - 'null'
        heldFields:
          additionalProperties: true
          description: >-
            Felder, die gegen automatische Uebernahme festgehalten sind (§19.3). Schluessel ist der
            Feldname, Wert traegt `by`, `at` und `reason`.
          type: object
        id:
          format: uuid
          type: string
        operation:
          enum:
            - insert
            - update
            - delete
          type: string
        owner:
          type: string
        projectId:
          format: uuid
          type: string
        requirementType:
          example: feature
          type: string
        sourceSystem:
          description: 'Herkunftssystem des Datensatzes (§19.1). Eigene Erfassung: infrademand.'
          example: infrademand
          type: string
        status:
          description: >-
            Interner Status. Noch nicht das stabile Statusvokabular des Integrationsvertrags nach
            CLAUDE.md §19.1 - die Abbildung folgt mit der Workflow-Engine in M4.
          example: neu
          type: string
        updatedAt:
          format: date-time
          type: string
        validFrom:
          format: date-time
          type: string
        validTo:
          description: Leer bei der aktuell gueltigen Version.
          format: date-time
          type:
            - string
            - 'null'
        version:
          example: 1
          type: integer
      required:
        - id
        - projectId
        - requirementType
        - status
        - owner
        - sourceSystem
        - externalId
        - dynamicAttributes
        - createdAt
        - updatedAt
        - version
        - heldFields
        - validFrom
        - validTo
        - operation
        - changedBy
        - changeSource
      type: object
    SetzeFesthaltungDto:
      properties:
        reason:
          example: Von SAP falsch gepflegt, Korrektur dort beantragt unter TICKET-4711
          maxLength: 500
          minLength: 10
          type: string
      required:
        - reason
      type: object
    UpdateAttributeDefinitionDto:
      properties:
        active:
          description: false setzt die Definition ausser Kraft, ohne sie zu loeschen.
          type: boolean
        allowedValues:
          items:
            type: string
          type: array
        dataType:
          enum:
            - text
            - number
            - boolean
            - date
            - enum
            - multi_enum
          type: string
        defaultValue:
          description: Vorgabewert, dem Datentyp entsprechend.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - items:
                type: string
              type: array
            - type: 'null'
        label:
          maxLength: 200
          type: string
        required:
          type: boolean
      required:
        - label
        - dataType
        - required
        - active
      type: object
    UpdateMastershipRuleDto:
      properties:
        mode:
          enum:
            - manual_allowed
            - automatic_wins
            - manual_locked
          type: string
      required:
        - mode
      type: object
    UpdateWorkflowDefinitionDto:
      properties:
        active:
          description: false setzt den Workflow ausser Kraft, ohne ihn zu loeschen.
          type: boolean
        initialState:
          maxLength: 100
          type: string
        label:
          maxLength: 200
          type: string
        mode:
          enum:
            - internal
            - external
          type: string
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateDto'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionDto'
          type: array
      required:
        - label
        - mode
        - initialState
        - states
        - transitions
        - active
      type: object
    WechsleZustandDto:
      properties:
        toState:
          description: Schluessel des Zielzustands aus dem geltenden Workflow.
          example: in_pruefung
          maxLength: 100
          type: string
      required:
        - toState
      type: object
    WorkflowDefinitionResponse:
      properties:
        active:
          description: false setzt den Workflow ausser Kraft, ohne ihn zu loeschen.
          type: boolean
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        initialState:
          example: neu
          type: string
        label:
          example: Standardablauf
          type: string
        mode:
          description: >-
            internal: Uebergaenge werden hier geprueft und abgewiesen. external: Ein Fremdsystem
            fuehrt den Vorgang, der Graph beschreibt ihn nur (ADR-0021).
          enum:
            - internal
            - external
          type: string
        requirementType:
          description: 'Anforderungstyp, fuer den der Workflow gilt. Leer bedeutet: fuer alle uebrigen.'
          type:
            - string
            - 'null'
        states:
          items:
            $ref: '#/components/schemas/WorkflowStateResponse'
          type: array
        transitions:
          items:
            $ref: '#/components/schemas/WorkflowTransitionResponse'
          type: array
        unreachableStates:
          description: >-
            Zustaende, die vom Anfangszustand aus nicht erreichbar sind. Kein Fehler - ein Graph im
            Aufbau ist unvollstaendig, nicht falsch -, aber ein Hinweis fuer die
            Verwaltungsoberflaeche.
          items:
            type: string
          type: array
        updatedAt:
          format: date-time
          type: string
        version:
          example: 1
          type: integer
      required:
        - id
        - label
        - requirementType
        - mode
        - initialState
        - states
        - transitions
        - unreachableStates
        - active
        - createdAt
        - updatedAt
        - version
      type: object
    WorkflowDefinitionVersionResponse:
