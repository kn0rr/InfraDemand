name: infrademand-local

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: id-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    container_name: id-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Abgeschaltet, solange nichts die Metriken abholt (PROD-031). Sie aktivieren die
      # HTTP-Instrumentierung von micrometer-core, deren offene DoS-Schwachstellen kein
      # Keycloak-Update behebt. Beim Aufbau der Beobachtbarkeit bewusst wieder einschalten.
      KC_METRICS_ENABLED: "false"
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; timeout --preserve-status 1 cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26@sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411
    container_name: id-keycloak-config
    profiles: ["config"]
    depends_on:
      keycloak:
        condition: service_healthy
    env_file:
      - ./local.env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
    volumes:
      - ../keycloak/realms:/config:ro

volumes:
  postgres-data:
