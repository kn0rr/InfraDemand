name: infrademand-local

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: id-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: id-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Abgeschaltet, solange nichts die Metriken abholt (PROD-031). Sie aktivieren die
      # HTTP-Instrumentierung von micrometer-core, deren offene DoS-Schwachstellen kein
      # Keycloak-Update behebt. Beim Aufbau der Beobachtbarkeit bewusst wieder einschalten.
      KC_METRICS_ENABLED: "false"
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../keycloak/realms:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; timeout --preserve-status 1 cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26@sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411
    container_name: id-keycloak-config
    profiles: ["config"]
    depends_on:
      keycloak:
        condition: service_healthy
    env_file:
      - ./local.env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      IMPORT_FILES_LOCATIONS: /config/*.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
    volumes:
      - ../keycloak/realms:/config:ro

  opa:
    image: openpolicyagent/opa:1.20.2@sha256:7b15f9d96345dfa639322ad97f65a0b38260f95efcdd7f5c24e284228708f06c
    container_name: id-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--authorization=basic"
      - "--set=decision_logs.console=true"
      - "/policies"
    ports:
      # Ausdruecklich nur an die Rueckschleife gebunden: Die Verwaltungs-API von OPA ist
      # unauthentifiziert und erlaubt das Ersetzen der Richtlinie (PROD-058).
      - "127.0.0.1:8181:8181"
    volumes:
      # Nur die Richtlinien, nicht die Tests - sonst bedient der Server auch die
      # Testregeln und gibt ihren Quelltext ueber /v1/policies heraus.
      - ../../services/requirement/policies:/policies:ro

volumes:
  postgres-data:
